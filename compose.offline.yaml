# Serve `english` and `multilingual` from checkpoint files on disk, with every Hub request
# disabled. Use with compose.yaml and compose.http.yaml:
#
#   LAYA_WEIGHTS_PATH=./weights docker compose \
#     -f compose.yaml -f compose.http.yaml -f compose.offline.yaml up -d --wait laya-serve
#
# Populate that directory first, on a host that has network access. Either with Python:
#
#   python scripts/fetch_offline_checkpoints.py --out ./weights
#
# or through Compose, with nothing on the host but Docker (see `laya-fetch` below):
#
#   mkdir -p weights
#   LAYA_WEIGHTS_PATH=./weights docker compose \
#     -f compose.yaml -f compose.http.yaml -f compose.offline.yaml run --rm laya-fetch
#
# LAYA_WEIGHTS_PATH names the directory that *contains* `convaiinnovations/`, which is what
# the script writes and what the mount below appends.
#
# For NVIDIA, append -f compose.cuda.yaml after this file. One-shot takes the same three files
# and selects the other service:
#
#   LAYA_WEIGHTS_PATH=./weights docker compose \
#     -f compose.yaml -f compose.http.yaml -f compose.offline.yaml run --rm laya
#
# compose.http.yaml has to stay in the list even for the one-shot service, because this file
# overrides `laya-serve` and only compose.http.yaml gives that service a build context;
# without it Compose rejects the project ("neither an image nor a build context specified").
#
# Why a bind mount rather than a warmed Hub cache: `Agent.__init__` resolves a model spec that
# names an existing directory before it considers a download, and the container's working
# directory is /home/laya. Mounting the tree at /home/laya/convaiinnovations therefore makes
# `convaiinnovations/laya` -- and the `multilingual` subfolder the Router asks for -- resolve to
# real files, with no cache layout (refs/, snapshots/, blobs/) to reproduce by hand. The named
# `model-cache` volume the base files declare stays mounted and simply goes unused.
services:
  laya-serve:
    environment:
      # No Hub request of any kind, including the revision lookup `snapshot_download` performs
      # on every Agent build. A checkpoint that is not on disk then fails immediately with
      # LocalEntryNotFoundError instead of waiting out a connection timeout.
      HF_HUB_OFFLINE: "1"
      # Build both checkpoints before the port is bound, so an incomplete mount fails
      # `up --wait` rather than the first request that happens to need the missing one.
      LAYA_PRELOAD: "1"
      # Must name checkpoints the mount actually carries. An empty value would preload the
      # whole family, `typed-decisions` included, which this tree does not hold by default.
      LAYA_MODELS: "${LAYA_MODELS:-english,multilingual}"
    volumes:
      # Read-only, which the published checkpoints allow: `_fix_tokenizer_config()` rewrites
      # <checkpoint>/tokenizer/tokenizer_config.json only when `tokenizer_class` is unset or
      # `extra_special_tokens` is a list, and at revision 55cf4c4e neither `english` nor
      # `multilingual` is (both declare PreTrainedTokenizerFast, and the multilingual mmBERT
      # config already stores a mapping). `scripts/fetch_offline_checkpoints.py` applies the
      # same normalisation up front, so a tree it produced never needs the server to write.
      #
      # Drop `:ro` if the log carries "laya: could not patch .../tokenizer_config.json": a
      # locally trained checkpoint or a later revision does need the rewrite, and on a
      # read-only mount the failure is only a warning -- AutoTokenizer then fails with
      # "'list' object has no attribute 'keys'", which does not name the cause.
      #
      # Either way the directory must be readable by UID 10001, the user the image runs as.
      - ${LAYA_WEIGHTS_PATH:?Set LAYA_WEIGHTS_PATH to the directory containing convaiinnovations}/convaiinnovations:/home/laya/convaiinnovations:ro

  # The one-shot quickstart resolves checkpoints through the same Router, so the same mount
  # serves it. Overriding `laya` here is safe in a way it would not be in compose.http.yaml:
  # that file is an always-on override, while this one is opted into per command.
  laya:
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${LAYA_WEIGHTS_PATH:?Set LAYA_WEIGHTS_PATH to the directory containing convaiinnovations}/convaiinnovations:/home/laya/convaiinnovations:ro

  # Runs scripts/fetch_offline_checkpoints.py inside the image, writing into LAYA_WEIGHTS_PATH on
  # the host, so the fetch host needs Docker and nothing else. It is the one service here that
  # talks to the Hub. Extra arguments reach the script:
  #
  #   ... run --rm laya-fetch --models english,multilingual,typed-decisions
  #   ... run --rm laya-fetch --revision <sha>
  #   ... run --rm laya-fetch --verify          # no network
  #
  # The `fetch` profile keeps it out of a bare `up`, which on the air-gapped host would otherwise
  # start a download; `run` still selects it by name.
  laya-fetch:
    profiles: ["fetch"]
    # Same build as laya-serve, so on a host that already built that image every layer is cached.
    build:
      context: .
      args:
        TORCH_INDEX: "${LAYA_TORCH_INDEX:-cpu}"
        TORCH_VERSION: "${LAYA_TORCH_VERSION:-2.14.0}"
    # Root, because a bind-mount directory Docker creates on a Linux host belongs to root and
    # UID 10001 could not write into it. The tree is handed back to whoever owns the mount
    # directory afterwards (`mkdir -p weights` first makes that you); files keep the default
    # 0644/0755, so UID 10001 can read them from laya-serve either way.
    user: "0:0"
    # The image's entrypoint still runs first, so HF_TOKEN_FILE works here too. `$$` is a literal
    # `$` for the shell; Compose would otherwise interpolate it.
    entrypoint:
      - python
      - /opt/laya/entrypoint.py
      - sh
      - -c
      - >-
        python /opt/laya/fetch_offline_checkpoints.py --out /weights
        --models "$${LAYA_MODELS:-english,multilingual}" "$$@";
        rc=$$?;
        chown -R "$$(stat -c %u:%g /weights)" /weights/convaiinnovations 2>/dev/null || true;
        exit $$rc
      - laya-fetch
    command: []
    environment:
      HF_HUB_OFFLINE: "0"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_TOKEN_FILE: "${HF_TOKEN_FILE:-}"
      # Same default as laya-serve above, so what is fetched is what gets preloaded.
      LAYA_MODELS: "${LAYA_MODELS:-english,multilingual}"
      # Only for the "Next, on the host that serves" hint, which should print the host path
      # rather than /weights.
      LAYA_WEIGHTS_PATH: "${LAYA_WEIGHTS_PATH}"
    volumes:
      # scripts/ is not in the build context (.dockerignore), so the script is mounted rather
      # than baked into an image the serving host also has to carry.
      - ./scripts/fetch_offline_checkpoints.py:/opt/laya/fetch_offline_checkpoints.py:ro
      - ${LAYA_WEIGHTS_PATH:?Set LAYA_WEIGHTS_PATH to the directory containing convaiinnovations}:/weights
    init: true
